<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VD Medicine Tracker</title>
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
    <h2 class="text-2xl font-black text-center text-gray-800 mb-6 flex items-center justify-center gap-2">
      💊 VD Medicine Tracker
    </h2>
    
    <div class="flex gap-2 mb-6">
      <button onclick="setMode('issue')" id="btnIssue" class="flex-1 py-2.5 rounded-xl font-bold transition bg-indigo-600 text-white cursor-pointer">Issue Drug</button>
      <button onclick="setMode('override')" id="btnOverride" class="flex-1 py-2.5 rounded-xl font-bold transition bg-gray-200 text-gray-700 cursor-pointer">Stock Audit</button>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Medicine Name</label>
        <input type="text" id="medName" class="w-full border border-gray-300 rounded-xl p-3 uppercase focus:outline-indigo-600" placeholder="e.g. PARACETAMOL">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Batch Code</label>
        <input type="text" id="batchCode" class="w-full border border-gray-300 rounded-xl p-3 uppercase focus:outline-indigo-600" placeholder="e.g. B987">
      </div>

      <!-- Mode A Fields -->
      <div id="issueBox" class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Quantity to Distribute</label>
          <input type="number" id="qtyIssue" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-indigo-600" placeholder="0">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Issued To</label>
          <input type="text" id="person" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-indigo-600" placeholder="Patient / Ward Name">
        </div>
      </div>

      <!-- Mode B Fields -->
      <div id="overrideBox" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Physical Inventory Count</label>
          <input type="number" id="qtyOverride" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-indigo-600" placeholder="Actual quantity on shelf">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Audit Check Date</label>
          <input type="date" id="auditDate" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-indigo-600">
        </div>
      </div>

      <button onclick="sendToGoogleSheets()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl shadow-md transition transform active:scale-98 cursor-pointer mt-4">
        Transmit To Ledger
      </button>
      <p id="status" class="text-center font-bold text-sm mt-4 min-h-[20px]"></p>
    </div>
  </div>

  <script>
    let currentMode = 'issue';
    // 🚨 PASTE YOUR STEP 3 GOOGLE DEPLOY WEB URL BETWEEN THE QUOTES BELOW 🚨
    const SCRIPT_URL = "YOUR_PASTED_LINK_HERE";

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('issueBox').classList.toggle('hidden', mode !== 'issue');
      document.getElementById('overrideBox').classList.toggle('hidden', mode !== 'override');
      document.getElementById('btnIssue').className = `flex-1 py-2.5 rounded-xl font-bold transition ${mode === 'issue' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}`;
      document.getElementById('btnOverride').className = `flex-1 py-2.5 rounded-xl font-bold transition ${mode === 'override' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}`;
    }

    async function sendToGoogleSheets() {
      const item = document.getElementById('medName').value.trim();
      const batch = document.getElementById('batchCode').value.trim();
      const status = document.getElementById('status');

      if (!item || !batch) {
        status.innerText = "⚠️ Missing Medicine Name or Batch Code";
        status.className = "text-center font-bold text-sm mt-4 text-red-500";
        return;
      }

      status.innerText = "Connecting to database ledger...";
      status.className = "text-center font-bold text-sm mt-4 text-blue-500";

      let payload = { item: item, batch: batch };
      if (currentMode === 'issue') {
        payload.action = "issueMedicine";
        payload.qty = document.getElementById('qtyIssue').value;
        payload.issuedTo = document.getElementById('person').value || "General Clinic";
      } else {
        payload.action = "bulkOverrideStock";
        payload.newQty = document.getElementById('qtyOverride').value;
        payload.auditDate = document.getElementById('auditDate').value;
      }

      try {
        await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
        status.innerText = "✅ Transaction Registered Successfully!";
        status.className = "text-center font-bold text-sm mt-4 text-emerald-600";
        document.getElementById('qtyIssue').value = '';
        document.getElementById('qtyOverride').value = '';
      } catch (err) {
        status.innerText = "❌ Network communication error.";
        status.className = "text-center font-bold text-sm mt-4 text-red-500";
      }
    }
  </script>
</body>
</html>
