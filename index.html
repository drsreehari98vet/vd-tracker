<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VD Medicine Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 16px; box-sizing: border-box; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
    h2 { text-align: center; margin-top: 0; margin-bottom: 24px; color: #1f2937; font-weight: 800; }
    .flex-group { display: flex; gap: 8px; margin-bottom: 24px; }
    .btn-tab { flex: 1; padding: 12px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
    .btn-active { background-color: #4f46e5; color: white; }
    .btn-inactive { background-color: #e5e7eb; color: #374151; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: bold; color: #374151; margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
    input:focus, select:focus { outline: 2px solid #4f46e5; }
    .btn-submit { width: 100%; background-color: #059669; color: white; font-weight: 900; padding: 16px; border-radius: 12px; border: none; font-size: 16px; cursor: pointer; margin-top: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .btn-submit:active { transform: scale(0.98); }
    .status { text-align: center; font-weight: bold; font-size: 14px; margin-top: 16px; min-height: 20px; }
    .hidden { display: none; }
    .text-red { color: #dc2626; }
    .text-blue { color: #2563eb; }
    .text-green { color: #059669; }
  </style>
</head>
<body onload="loadMedicineDropdown()">
  <div class="card">
    <h2>💊 VD Medicine Tracker</h2>
    
    <div class="flex-group">
      <button onclick="setMode('issue')" id="btnIssue" class="btn-tab btn-active">Issue Drug</button>
      <button onclick="setMode('override')" id="btnOverride" class="btn-tab btn-inactive">Stock Audit</button>
    </div>

    <div class="form-group">
      <label>Select Medicine Name</label>
      <select id="medName">
        <option value="">-- Loading Stock List... --</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Batch Code</label>
      <input type="text" id="batchCode" style="text-transform: uppercase;" placeholder="e.g. B100">
    </div>

    <!-- Mode A: Issue -->
    <div id="issueBox">
      <div class="form-group">
        <label>Quantity to Distribute</label>
        <input type="number" id="qtyIssue" placeholder="0">
      </div>
      <div class="form-group">
        <label>Issued To</label>
        <input type="text" id="person" placeholder="Patient / Ward Name">
      </div>
    </div>

    <!-- Mode B: Stock Audit -->
    <div id="overrideBox" class="hidden">
      <div class="form-group">
        <label>Physical Inventory Count</label>
        <input type="number" id="qtyOverride" placeholder="Actual quantity on shelf">
      </div>
      <div class="form-group">
        <label>Audit Check Date</label>
        <input type="date" id="auditDate">
      </div>
    </div>

    <button onclick="sendToGoogleSheets()" class="btn-submit">Transmit To Ledger</button>
    <p id="status" class="status"></p>
  </div>

  <script>
    let currentMode = 'issue';
    
    // 🌟 BUILT-IN: YOUR SPECIFIC ROUTING METRICS 🌟
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKUiHeQYlXYJmdsKxSx2jW2TWVviQ1lULGsBX6Us2iPxMFDy5DifYr0y8A80gYwWYG/exec";
    const SPREADSHEET_ID = "1RupXrB2LYQcy1FuC_SRVia2hwjp562ASMcAq_XbTibE";

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('issueBox').classList.toggle('hidden', mode !== 'issue');
      document.getElementById('overrideBox').classList.toggle('hidden', mode !== 'override');
      document.getElementById('btnIssue').className = `btn-tab ${mode === 'issue' ? 'btn-active' : 'btn-inactive'}`;
      document.getElementById('btnOverride').className = `btn-tab ${mode === 'override' ? 'btn-active' : 'btn-inactive'}`;
    }

    // 🌟 DYNAMIC LOADER BYPASSES CORS AND SECURITY ISSUES 🌟
    async function loadMedicineDropdown() {
      const dropdown = document.getElementById('medName');
      try {
        const dataUrl = `https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Stock`;
        
        const response = await fetch(dataUrl);
        const text = await response.text();
        
        // Uncover the true object data from the Google JSON text block wrapper
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonString);
        const rows = data.table.rows;
        
        dropdown.innerHTML = '<option value="">-- Choose Medicine --</option>';
        let medicineSet = new Set();
        
        // Read Column C data fields (Index 2)
        for (let i = 0; i < rows.length; i++) {
          if (rows[i].c && rows[i].c[2] && rows[i].c[2].v) {
            let itemVal = rows[i].c[2].v.toString().toUpperCase().trim();
            if (itemVal !== "ITEM" && itemVal !== "") { 
              medicineSet.add(itemVal);
            }
          }
        }
        
        if (medicineSet.size === 0) {
          dropdown.innerHTML = '<option value="">-- Spreadsheet Stock is Empty --</option>';
          return;
        }
        
        medicineSet.forEach(med => {
          let option = document.createElement('option');
          option.value = med;
          option.innerText = med;
          dropdown.appendChild(option);
        });
        
      } catch (err) {
        dropdown.innerHTML = '<option value="">⚠️ Error Loading List Items</option>';
        console.error("Dropdown error details:", err);
      }
    }

    async function sendToGoogleSheets() {
      const item = document.getElementById('medName').value.trim();
      const batch = document.getElementById('batchCode').value.trim().toUpperCase();
      const status = document.getElementById('status');

      if (!item || !batch) {
        status.innerText = "⚠️ Missing Medicine Selection or Batch Code";
        status.className = "status text-red";
        return;
      }

      status.innerText = "Processing secure ledger submission...";
      status.className = "status text-blue";

      let payload = { item: item, batch: batch };
      if (currentMode === 'issue') {
        payload.action = "issueMedicine";
        payload.qty = document.getElementById('qtyIssue').value;
        payload.issuedTo = document.getElementById('person').value || "General Clinic";
        if(!payload.qty) { status.innerText = "⚠️ Enter Issue Quantity"; status.className="status text-red"; return; }
      } else {
        payload.action = "bulkOverrideStock";
        payload.newQty = document.getElementById('qtyOverride').value;
        payload.auditDate = document.getElementById('auditDate').value;
        if(!payload.newQty || !payload.auditDate) { status.innerText = "⚠️ Enter Quantity & Audit Date"; status.className="status text-red"; return; }
      }

      try {
        await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
        status.innerText = "✅ Action Saved in Google Sheet Ledger!";
        status.className = "status text-green";
        document.getElementById('qtyIssue').value = '';
        document.getElementById('qtyOverride').value = '';
        
        // Instantly refresh dropdown listings to show real-time changes
        setTimeout(loadMedicineDropdown, 1500);
      } catch (err) {
        status.innerText = "❌ Transaction routing path error.";
        status.className = "status text-red";
      }
    }
  </script>
</body>
</html>
